services:
  # API key auth
  crowd_control:
    build: .
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
    volumes:
      - ${PROJECT_DIR:-.}:/workspace
      - ${CONFIG_DIR:-./config/templates}:/config
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp
      - /home/crowdctl/.claude
      - /home/crowdctl/.npm
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"

  # Subscription auth (mount ~/.claude for OAuth/setup-token)
  crowd_control_sub:
    build: .
    environment:
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
    volumes:
      - ${PROJECT_DIR:-.}:/workspace
      - ${CONFIG_DIR:-./config/templates}:/config
      - ${CLAUDE_HOME:-~/.claude}:/home/crowdctl/.claude
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp
      - /home/crowdctl/.npm
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"

  # Multiple isolated workers
  worker:
    build: .
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
    volumes:
      - ${PROJECT_DIR:-.}:/workspace
      - ${CONFIG_DIR:-./config/templates}:/config
    stdin_open: true
    tty: true
    read_only: true
    tmpfs:
      - /tmp
      - /home/crowdctl/.claude
      - /home/crowdctl/.npm
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      replicas: ${WORKER_COUNT:-3}
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.5"
