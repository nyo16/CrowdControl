name: CI

on:
  push:
    branches: [master]
    # Two independent release channels, deliberately. `v*` releases the Hex
    # package; `sandboxd-v*` publishes only the agent tarball. They were the same
    # tag, which meant the artifact the GCE provider *requires* as
    # `:sandboxd_url` could not be published without also publishing to Hex — so
    # in practice it was never published at all, and the docs carried a
    # placeholder URL. `refs/tags/sandboxd-v…` does not start with
    # `refs/tags/v`, so the Hex job stays gated to the package channel.
    tags: ["v*", "sandboxd-v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MIX_ENV: test
  # The toolchain every single-version job uses -- format, credo, dialyzer,
  # docs, coverage, publish -- and the one the setup job's build cache is keyed
  # to. Kept in step with what the maintainers actually run locally: the
  # formatter's output changes between Elixir minors, so a CI formatter older
  # than the local one fails `--check-formatted` on correctly-formatted code.
  ELIXIR_VERSION: "1.20.2"
  OTP_VERSION: "29.0.3"

jobs:
  # Fetches and compiles dependencies exactly once. Every Linux job below
  # restores this cache with fail-on-cache-miss instead of repeating
  # `mix deps.get` + `mix deps.compile`.
  #
  # Note this compiles dependencies only, never the project itself: the
  # cache key is keyed on mix.lock, so a source-only change would still be
  # a cache hit. Compiling the project here would let `--warnings-as-errors`
  # be skipped for exactly the changes most likely to introduce a warning.
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.key.outputs.value }}
      plt-key: ${{ steps.key.outputs.plt }}
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Compute cache keys
        id: key
        env:
          LOCK_HASH: ${{ hashFiles('mix.lock') }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          echo "value=${RUNNER_OS}-mix-${ELIXIR_VERSION}-${OTP_VERSION}-test-${LOCK_HASH}" >> "$GITHUB_OUTPUT"
          echo "plt=${RUNNER_OS}-plt-${ELIXIR_VERSION}-${OTP_VERSION}-${LOCK_HASH}" >> "$GITHUB_OUTPUT"

      - name: Cache deps & build
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ steps.key.outputs.value }}

      - run: mix deps.get
        if: steps.cache.outputs.cache-hit != 'true'

      - run: mix deps.compile
        if: steps.cache.outputs.cache-hit != 'true'

  compile:
    name: Compile & Warnings
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

  optional_deps:
    name: Consumer without optional deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # Every other job resolves the full dep tree, so :req, :kubereq and
      # :gcp_compute are always present and a missing @compile
      # {:no_warn_undefined, _} is invisible here. It is not invisible to
      # someone who installs this package and uses only Backend.Local: 0.1.0
      # shipped a `Kubereq.Connect` warning that way, and 0.1.1 shipped three
      # more for `Req.Request` and `:telemetry`. Both were found by a human
      # installing the release, which is too late and twice too often.
      #
      # This builds a scratch project that depends on the checkout and nothing
      # optional, and fails on any warning at all.
      - name: Compile as a consumer with no optional dependencies
        run: |
          mkdir -p /tmp/consumer/lib
          cd /tmp/consumer
          cat > mix.exs <<EOF
          defmodule Consumer.MixProject do
            use Mix.Project

            def project do
              [app: :consumer, version: "0.0.0", elixir: "~> 1.19", deps: deps()]
            end

            def application, do: [extra_applications: [:logger]]

            defp deps, do: [{:crowd_control, path: "$GITHUB_WORKSPACE"}]
          end
          EOF
          mix deps.get
          for d in req kubereq gcp_compute; do
            if [ -d "deps/$d" ]; then
              echo "::error::$d resolved, so this job is not testing what it claims"
              exit 1
            fi
          done
          mix compile --force 2>&1 | tee /tmp/consumer-compile.txt
          if grep -qi warning /tmp/consumer-compile.txt; then
            echo "::error::a consumer without optional deps sees compile warnings"
            exit 1
          fi

  format:
    name: Formatting
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - run: mix format --check-formatted

  credo:
    name: Credo
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - run: mix credo --strict

  test:
    name: Tests (${{ matrix.os }} / OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }})
    runs-on: ${{ matrix.os }}
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Current toolchain, and the only leg whose build cache the setup job
          # can supply -- see the shared-cache note below.
          - os: ubuntu-latest
            elixir: "1.20.2"
            otp: "29.0.3"
            shared-cache: true
          # The 1.18.3 lower-bound leg was REMOVED, not forgotten: mix.exs now
          # declares `elixir: "~> 1.19"` because :gcp_compute requires it, so a
          # 1.18 leg can no longer compile the project at all. The principle
          # that leg encoded still governs this matrix and is preserved by the
          # leg below: an untested lower bound is a claim, not a guarantee.
          #
          # New floor. Only `mix test` runs here, never `--check-formatted`:
          # the formatter's output changes between Elixir minors, and pinning
          # that check to one version is what the ELIXIR_VERSION note above is
          # about.
          - os: ubuntu-latest
            elixir: "1.19"
            otp: "28"
            shared-cache: false
          - os: macos-latest
            elixir: "1.20.2"
            otp: "29.0.3"
            shared-cache: false
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # `_build` artifacts are toolchain-specific, so the setup job's cache is
      # only valid for a leg on the SAME OS and the same Elixir/OTP pair it ran
      # with. Every other leg -- macOS, and the 1.18 lower bound -- keeps its
      # own cache and builds deps itself.
      - uses: actions/cache/restore@v5
        if: matrix.shared-cache
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - uses: actions/cache@v5
        if: ${{ !matrix.shared-cache }}
        with:
          path: |
            deps
            _build/test
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-test-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-test-

      - name: Build deps (legs without the shared cache)
        if: ${{ !matrix.shared-cache }}
        run: |
          mix deps.get
          mix deps.compile

      - run: mix compile
      - run: mix test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - run: mix coveralls.json

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover/excoveralls.json

  sobelow:
    name: Sobelow
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - run: mix sobelow --exit --skip

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - run: mix hex.audit
      - run: mix deps.audit

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # Restores the `deps` sources; `mix docs` runs in :dev, so _build/dev
      # is compiled fresh here regardless.
      - uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - run: MIX_ENV=dev mix docs

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: doc/

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Cache PLTs
        uses: actions/cache@v5
        with:
          path: priv/plts
          key: ${{ needs.setup.outputs.plt-key }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix compile
      - run: mix dialyzer

  # The nested sandboxd app has its own mix project, its own lockfile and its
  # own four-package dependency set, so it gets its own job rather than riding
  # the root cache: restoring _build from the root project would mix two
  # unrelated dependency trees.
  sandboxd:
    name: sandboxd (agent release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache@v5
        with:
          path: |
            sandboxd/deps
            sandboxd/_build
          key: ${{ runner.os }}-sandboxd-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-${{ hashFiles('sandboxd/mix.lock') }}

      - name: Fetch deps
        working-directory: sandboxd
        run: mix deps.get

      - name: Compile with warnings as errors
        working-directory: sandboxd
        run: mix compile --warnings-as-errors

      - name: Formatting
        working-directory: sandboxd
        run: mix format --check-formatted

      # `mix test` here is aliased to `test --no-start`, because
      # Sandboxd.Application refuses to boot without CC_SANDBOXD_TOKEN and that
      # fail-closed behaviour is a security property, not a test inconvenience.
      - name: Tests
        working-directory: sandboxd
        run: mix test

  # Builds the agent release for both Linux architectures and publishes the
  # tarballs with their checksums.
  #
  # It builds INSIDE the target image, not on the runner: an OTP release embeds
  # ERTS and links against the build host's glibc, so a release built on
  # ubuntu-latest would fail to start on debian-bookworm. Provider.Gce's startup
  # script verifies a mandatory SHA-256 against these assets, which is why the
  # checksum is published rather than merely logged.
  sandboxd-release:
    name: sandboxd release (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: [sandboxd]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'arm64'

      - uses: docker/setup-buildx-action@v3

      - name: Build the release inside the target image
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --target sandboxd-artifact \
            --output "type=local,dest=./release-${{ matrix.arch }}" \
            .

      - name: Package tarball and checksum
        run: |
          mkdir -p dist
          tar -C "release-${{ matrix.arch }}" -czf \
            "dist/sandboxd-linux-${{ matrix.arch }}.tar.gz" sandboxd
          cd dist
          sha256sum "sandboxd-linux-${{ matrix.arch }}.tar.gz" \
            > "sandboxd-linux-${{ matrix.arch }}.tar.gz.sha256"
          cat "sandboxd-linux-${{ matrix.arch }}.tar.gz.sha256"

      - name: Smoke-test the release actually starts
        if: matrix.arch == 'amd64'
        run: |
          # A release that builds but cannot boot is worse than a failed build,
          # because the failure surfaces inside a customer's sandbox instead of
          # here. Only the native arch is run; the arm64 tarball is emulated and
          # a QEMU boot failure would not be evidence of anything.
          docker build --target sandbox-dev -t sandboxd-smoke:ci .
          CID=$(docker run -d -e CC_SANDBOXD_TOKEN=ci-token \
            -e CC_SANDBOXD_BIND=0.0.0.0 -p 127.0.0.1:18080:8080 \
            sandboxd-smoke:ci start)
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/v1/health | grep -q '"ok":true'; then
              echo "agent healthy"
              docker rm -f "$CID" >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "agent never answered /v1/health"
          docker logs "$CID" || true
          docker rm -f "$CID" >/dev/null
          exit 1

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sandboxd-linux-${{ matrix.arch }}
          path: dist/

      # Both channels carry the tarball: a package release should ship the agent
      # it documents, and a `sandboxd-v*` tag ships the agent alone. The checksum
      # sidecar goes with it because `:sandboxd_sha256` is mandatory and never
      # skipped — a URL without its checksum is not a usable artifact.
      - name: Attach to the GitHub release
        if: |
          startsWith(github.ref, 'refs/tags/v') ||
          startsWith(github.ref, 'refs/tags/sandboxd-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  publish:
    name: Publish to Hex
    runs-on: ubuntu-latest
    needs:
      [compile, format, credo, test, coverage, sobelow, audit, docs, dialyzer, sandboxd]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set version from tag
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          TAG_VERSION="${TAG_REF#refs/tags/v}"
          sed -i "s/@version \".*\"/@version \"${TAG_VERSION}\"/" mix.exs
          grep '@version' mix.exs

      # CI rewrites mix.exs from the tag but never the changelog, so the two can
      # disagree and only the changelog ships wrong. v0.1.1 caught this by hand;
      # v0.2.0 did not, and published with "## Unreleased" as its heading —
      # permanently, since hexdocs is per-version. Fail before publishing
      # instead.
      - name: Require a CHANGELOG heading for this version
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          TAG_VERSION="${TAG_REF#refs/tags/v}"
          ESCAPED=$(printf '%s' "$TAG_VERSION" | sed 's/\./\\./g')
          if ! grep -qE "^## ${ESCAPED}( |\$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${TAG_VERSION}' heading. Rename '## Unreleased' before tagging — the tag sets the package version, this file does not follow it."
            exit 1
          fi
          echo "found: $(grep -m1 -E "^## ${ESCAPED}( |\$)" CHANGELOG.md)"

      - run: mix deps.get
        env:
          MIX_ENV: dev
      - run: mix compile
        env:
          MIX_ENV: dev

      - name: Publish package to Hex
        run: mix hex.publish package --yes
        env:
          MIX_ENV: dev
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

      - name: Publish docs to HexDocs
        run: mix hex.publish docs --yes
        env:
          MIX_ENV: dev
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
