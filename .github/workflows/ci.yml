name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MIX_ENV: test
  # The toolchain every single-version job uses -- format, credo, dialyzer,
  # docs, coverage, publish -- and the one the setup job's build cache is keyed
  # to. Kept in step with what the maintainers actually run locally: the
  # formatter's output changes between Elixir minors, so a CI formatter older
  # than the local one fails `--check-formatted` on correctly-formatted code.
  ELIXIR_VERSION: "1.20.2"
  OTP_VERSION: "29.0.3"

jobs:
  # Fetches and compiles dependencies exactly once. Every Linux job below
  # restores this cache with fail-on-cache-miss instead of repeating
  # `mix deps.get` + `mix deps.compile`.
  #
  # Note this compiles dependencies only, never the project itself: the
  # cache key is keyed on mix.lock, so a source-only change would still be
  # a cache hit. Compiling the project here would let `--warnings-as-errors`
  # be skipped for exactly the changes most likely to introduce a warning.
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.key.outputs.value }}
      plt-key: ${{ steps.key.outputs.plt }}
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Compute cache keys
        id: key
        env:
          LOCK_HASH: ${{ hashFiles('mix.lock') }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          echo "value=${RUNNER_OS}-mix-${ELIXIR_VERSION}-${OTP_VERSION}-test-${LOCK_HASH}" >> "$GITHUB_OUTPUT"
          echo "plt=${RUNNER_OS}-plt-${ELIXIR_VERSION}-${OTP_VERSION}-${LOCK_HASH}" >> "$GITHUB_OUTPUT"

      - name: Cache deps & build
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ steps.key.outputs.value }}

      - run: mix deps.get
        if: steps.cache.outputs.cache-hit != 'true'

      - run: mix deps.compile
        if: steps.cache.outputs.cache-hit != 'true'

  compile:
    name: Compile & Warnings
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

  format:
    name: Formatting
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - run: mix format --check-formatted

  credo:
    name: Credo
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - run: mix credo --strict

  test:
    name: Tests (${{ matrix.os }} / OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }})
    runs-on: ${{ matrix.os }}
    needs: [setup]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Current toolchain, and the only leg whose build cache the setup job
          # can supply -- see the shared-cache note below.
          - os: ubuntu-latest
            elixir: "1.20.2"
            otp: "29.0.3"
            shared-cache: true
          # Lower bound. mix.exs declares `elixir: "~> 1.18"`, and an untested
          # lower bound is a claim, not a guarantee. Drop this leg only together
          # with that constraint.
          - os: ubuntu-latest
            elixir: "1.18.3"
            otp: "27.2"
            shared-cache: false
          - os: macos-latest
            elixir: "1.20.2"
            otp: "29.0.3"
            shared-cache: false
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # `_build` artifacts are toolchain-specific, so the setup job's cache is
      # only valid for a leg on the SAME OS and the same Elixir/OTP pair it ran
      # with. Every other leg -- macOS, and the 1.18 lower bound -- keeps its
      # own cache and builds deps itself.
      - uses: actions/cache/restore@v5
        if: matrix.shared-cache
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - uses: actions/cache@v5
        if: ${{ !matrix.shared-cache }}
        with:
          path: |
            deps
            _build/test
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-test-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-test-

      - name: Build deps (legs without the shared cache)
        if: ${{ !matrix.shared-cache }}
        run: |
          mix deps.get
          mix deps.compile

      - run: mix compile
      - run: mix test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - run: mix coveralls.json

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover/excoveralls.json

  sobelow:
    name: Sobelow
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - run: mix sobelow --exit --skip

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - run: mix hex.audit
      - run: mix deps.audit

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # Restores the `deps` sources; `mix docs` runs in :dev, so _build/dev
      # is compiled fresh here regardless.
      - uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - run: MIX_ENV=dev mix docs

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: doc/

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - uses: actions/cache/restore@v5
        with:
          path: |
            deps
            _build/test
          key: ${{ needs.setup.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Cache PLTs
        uses: actions/cache@v5
        with:
          path: priv/plts
          key: ${{ needs.setup.outputs.plt-key }}
          restore-keys: |
            ${{ runner.os }}-plt-${{ env.ELIXIR_VERSION }}-${{ env.OTP_VERSION }}-

      - run: mix compile
      - run: mix dialyzer

  publish:
    name: Publish to Hex
    runs-on: ubuntu-latest
    needs: [compile, format, credo, test, coverage, sobelow, audit, docs, dialyzer]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Set version from tag
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          TAG_VERSION="${TAG_REF#refs/tags/v}"
          sed -i "s/@version \".*\"/@version \"${TAG_VERSION}\"/" mix.exs
          grep '@version' mix.exs

      - run: mix deps.get
        env:
          MIX_ENV: dev
      - run: mix compile
        env:
          MIX_ENV: dev

      - name: Publish package to Hex
        run: mix hex.publish package --yes
        env:
          MIX_ENV: dev
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

      - name: Publish docs to HexDocs
        run: mix hex.publish docs --yes
        env:
          MIX_ENV: dev
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
